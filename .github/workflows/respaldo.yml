name: Respaldo diario de la base

# Corre todas las noches a las 11:30 p.m. de Bogotá (04:30 UTC) y guarda el respaldo como
# archivo descargable en esta ejecución (Actions → Respaldo diario → Artifacts), 90 días.
# Necesita el secreto DB_URL en GitHub → Settings → Secrets and variables → Actions.
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  respaldo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/backup.mjs
        env:
          DB_URL: ${{ secrets.DB_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: respaldo-${{ github.run_id }}
          path: backups/
          retention-days: 90
